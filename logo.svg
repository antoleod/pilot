<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- === Spreadsheet icon === -->

  <!-- Outer sheet border -->
  <rect x="72" y="88" width="368" height="336" rx="18" fill="none" stroke="white" stroke-width="18" stroke-opacity="0.25"/>

  <!-- Header row background -->
  <rect x="72" y="88" width="368" height="72" rx="18" fill="white" fill-opacity="0.18"/>

  <!-- Header: col A label -->
  <rect x="104" y="112" width="120" height="24" rx="6" fill="white" fill-opacity="0.7"/>
  <!-- Header: col B label -->
  <rect x="260" y="112" width="120" height="24" rx="6" fill="white" fill-opacity="0.4"/>

  <!-- Vertical divider -->
  <line x1="232" y1="88" x2="232" y2="344" stroke="white" stroke-width="10" stroke-opacity="0.2"/>

  <!-- Row 1 — source A (left, solid) / source B (right, faint) -->
  <rect x="104" y="188" width="100" height="20" rx="5" fill="white" fill-opacity="0.7"/>
  <rect x="260" y="188" width="100" height="20" rx="5" fill="white" fill-opacity="0.35"/>

  <!-- Row 2 -->
  <rect x="104" y="224" width="82" height="20" rx="5" fill="white" fill-opacity="0.7"/>
  <rect x="260" y="224" width="116" height="20" rx="5" fill="white" fill-opacity="0.35"/>

  <!-- Row 3 -->
  <rect x="104" y="260" width="112" height="20" rx="5" fill="white" fill-opacity="0.7"/>
  <rect x="260" y="260" width="88" height="20" rx="5" fill="white" fill-opacity="0.35"/>

  <!-- === Merged result row (bottom, full width, highlighted) === -->
  <rect x="72" y="304" width="368" height="120" rx="0 0 18 18" fill="white" fill-opacity="0.15"/>
  <rect x="72" y="304" width="368" height="120" rx="0" fill="none" stroke="white" stroke-width="10" stroke-opacity="0.25"/>

  <!-- Merged row label pills (full-width, brighter = merged data) -->
  <rect x="104" y="324" width="280" height="22" rx="6" fill="white" fill-opacity="0.9"/>
  <rect x="104" y="358" width="220" height="22" rx="6" fill="white" fill-opacity="0.9"/>

  <!-- Small checkmark badge over the merged area -->
  <circle cx="404" cy="344" r="30" fill="white"/>
  <path d="M390 344 L400 356 L420 330" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
